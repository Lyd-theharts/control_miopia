<div class="container-fluid bg-purple min-vh-100 d-flex flex-column">
    <!-- Top Right: Logout Button -->
    <div class="p-3 position-absolute top-0 end-0">
        <button (click)="logout()" class="btn btn-logout">
            <i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión
        </button>
    </div>

    <!-- Dashboard Content -->
    <div class="row flex-grow-1 justify-content-center align-items-center text-center">
        <div class="col-12">
            <h1 class="text-white mb-5">Área Clínica</h1>

            <div class="d-flex justify-content-center gap-4 flex-wrap mb-5">
                <!-- Patient List Button -->
                <button routerLink="/pacientes"
                    class="btn btn-dashboard p-4 d-flex flex-column align-items-center justify-content-center">
                    <i class="bi bi-people-fill fs-1 mb-3"></i>
                    <span class="fs-4">Lista de Pacientes</span>
                </button>

                <!-- New Client Button -->
                <button (click)="navigateToNewPatient()"
                    class="btn btn-dashboard p-4 d-flex flex-column align-items-center justify-content-center">
                    <i class="bi bi-person-plus-fill fs-1 mb-3"></i>
                    <span class="fs-4">Nuevo Paciente</span>
                </button>
            </div>

            <!-- Decorative Image -->
            <div class="mt-4">
                <img src="https://media.allaboutvision.com/cms/caas/v1/media/586460/data/picture/d63f2952cdc1721d445cfd46f6e35e55.jpg"
                    alt="Control de Miopía" class="img-fluid rounded shadow-lg"
                    style="max-width: 600px; border: 4px solid white;">
            </div>
        </div>
    </div>
</div>
